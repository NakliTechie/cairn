[project]
name = "cairn-scheduler"
version = "0.1.0"
description = "Cairn multi-stream scheduler + simulation core (no-GPU mock runtime). The core net-new build."
requires-python = ">=3.9"
dependencies = ["pyyaml>=6.0"]

[dependency-groups]
dev = ["pytest>=7.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cairn_scheduler"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
