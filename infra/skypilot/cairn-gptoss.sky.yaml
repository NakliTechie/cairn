# Cairn gpt-oss-120b on g7e/Blackwell — the headline-env validation run (NOT a distributed-recovery demo).
#
# gpt-oss-120b is 63 GiB MXFP4 → fits a SINGLE g7e.2xlarge (96 GiB) → no multi-box split needed today. The
# point of this run is to prove: (a) the new headline env (sglang 0.5.13.post1 + transformers 5.8.1) loads
# and runs gpt-oss on real Blackwell HW (resolves the Rung-2 transformers-4.51 blocker for real, not just
# at the config-recognition level we've already proven on L4); (b) the OpenAI BYOK endpoint serves real
# gpt-oss text — the same usable shape as the llama serve. Distributed split + recovery is the next step
# (GLM-5.2 NVFP4 ~750B, the real headline that genuinely needs multi-box).
#
#   set -a; source infra/secrets.env; set +a   # set -a EXPORTS so `sky --env` sees them
#   sky launch -c cairn-gptoss infra/skypilot/cairn-gptoss.sky.yaml --env HF_TOKEN --env CAIRN_API_KEY=sk-cairn-demo \
#     -i 30 --down -d                                                              # detached; -i 30 = 30-min idle stop
#   ssh -L 8888:localhost:8000 cairn-gptoss -N &
#   curl localhost:8888/v1/chat/completions -H 'authorization: Bearer sk-cairn-demo' -H 'content-type: application/json' \
#     -d '{"model":"openai/gpt-oss-120b","messages":[{"role":"user","content":"hi"}],"max_tokens":64}'
#   sky down cairn-gptoss
name: cairn-gptoss

num_nodes: 1
resources:
  infra: aws/ap-northeast-2         # SEOUL — g7e Blackwell spot ~$0.59-0.64/hr (catalog/dryrun confirmed)
  instance_type: g7e.2xlarge        # 1× RTX PRO 6000 Blackwell (sm_120), 96 GiB → 63 GiB MXFP4 + 33 GiB headroom
  use_spot: true
  disk_size: 200                    # gpt-oss-120b weights ~63 GiB on disk
  # CRITICAL: AWS Deep Learning Base OSS GPU AMI (Ubuntu 22.04, 2026-06-19). SkyPilot's default Ubuntu AMI
  # ships nvidia driver 535.216.01 — which DOES NOT recognize Blackwell sm_120 (RTX PRO 6000); the kernel
  # module probe fails with error -1, nvidia-smi reports "no NVIDIA driver." Blackwell needs R570+;
  # this DLAMI ships R575. Discovered 2026-06-23 the hard way on a maiden g7e launch.
  image_id: ami-02f2234b443117395
  labels:
    cairn: "true"
    cairn-purpose: "gptoss-blackwell-env-validation"

file_mounts:
  /cairn/infra: ./infra

setup: |
  set -uo pipefail
  # use miniconda's python (has ensurepip — the proven-on-worker3 recipe)
  PY=$([ -x "$HOME/miniconda3/bin/python3" ] && echo "$HOME/miniconda3/bin/python3" || echo python3)
  $PY -m venv ~/cairn-headline-env
  ~/cairn-headline-env/bin/pip install -q --upgrade pip
  ~/cairn-headline-env/bin/pip install -q -r /cairn/infra/requirements-gpu-headline.txt
  ~/cairn-headline-env/bin/python -c "import sglang,transformers; print('OK sglang',sglang.__version__,'transformers',transformers.__version__)" || true
  nvidia-smi --query-gpu=name,memory.total,driver_version --format=csv,noheader || true

run: |
  set -uo pipefail
  export PATH=$HOME/cairn-headline-env/bin:/usr/local/cuda/bin:$PATH
  MODEL=${MODEL:-openai/gpt-oss-120b}
  API_KEY=${CAIRN_API_KEY:-sk-cairn-demo}
  # ── Blackwell sm_120 config (from the NVIDIA-forum "full debug path" thread — what naively-pip-installed
  #    sglang on RTX PRO 6000 Blackwell actually breaks on; documented working set):
  export FLASHINFER_CUDA_ARCH_LIST=12.0f       # single-arch — sglang's default "12.0f;12.1a" trips a flashinfer unpack on import
  export VLLM_FASTSAFETENSORS_NOGDS=1          # GPUDirect Storage not present in the g7e AMI
  export FLASHINFER_LOGLEVEL=0
  echo "[gptoss] $(date) launching sglang.launch_server: $MODEL  (Blackwell sm_120 config)"
  nvidia-smi --query-gpu=name,memory.used,memory.total --format=csv,noheader || true
  # serve via sglang.launch_server directly — its built-in OpenAI /v1/chat/completions + bearer auth.
  # NOT the cairn distributed-with-recovery path (single-box; that's GLM-5.2 territory).
  #   --disable-cuda-graph: sglang's "force eager" — the forum's "--enforce-eager" was vllm's flag,
  #     a mixed setup; sglang's equivalent is --disable-cuda-graph (no Triton-graph capture on sm_120)
  #   --attention-backend flashinfer + --quantization mxfp4 + --kv-cache-dtype fp8_e5m2: the working trio
  python -u -m sglang.launch_server \
    --model-path "$MODEL" --port 8000 --host 0.0.0.0 --api-key "$API_KEY" \
    --mem-fraction-static 0.85 \
    --disable-cuda-graph \
    --attention-backend triton \
    --quantization mxfp4 \
    --kv-cache-dtype fp8_e5m2 \
    2>&1 | tee /tmp/cairn-gptoss-serve.log

envs:
  HF_TOKEN: ""
  CAIRN_API_KEY: "sk-cairn-demo"
