# Cairn single-GPU DEV box — a bare g6.xlarge (L4) spot for ITERATING on the SGLang
# block-forward. NOT the fleet serve path (cairn-block.sky.yaml runs cairn_node.serve):
# this box provisions + installs the GPU env, then stays UP for `sky exec`/SSH.
# Auto-downs on idle (cost guard); tear down explicitly with `sky down cairn-dev`.
name: cairn-dev

resources:
  cloud: aws
  region: eu-south-2          # Spain — cheap g6 spot, <5% interruption
  instance_type: g6.xlarge    # 1x L4 (Ada, sm_89), 24 GB
  use_spot: true
  disk_size: 128
  labels:
    cairn: "true"             # IAM destructive-action gate + cost-allocation tag
    cairn-purpose: "dev"      # cost breakdown by purpose; the benchmark runs use spot-proof | ondemand-baseline

# Only the code the harness/forward/serving need (skips scheduler/.venv etc.).
file_mounts:
  /cairn/fork: ./fork
  /cairn/cairn_node: ./cairn_node   # the multi-node serving layer (cairn_node.serve / .pipeline)
  /cairn/configs: ./configs
  /cairn/infra: ./infra

# Stable, reliable deps in setup; sglang/flashinfer get verified interactively via `sky exec`
# (they're the box-version-specific part — react to errors rather than bake a brittle setup).
setup: |
  set -uo pipefail
  echo ">>> GPU:"; nvidia-smi || true
  python3 -m venv ~/cairn-env
  ~/cairn-env/bin/pip install -q --upgrade pip
  echo ">>> box image: sglang[srt] + torch 2.6 + transformers 4.51.1 + cryptography (wire) ..."
  ~/cairn-env/bin/pip install -q -r /cairn/infra/requirements-gpu.txt
  echo ">>> force the compressed-tensors pin (pre-masking_utils; belt-and-suspenders over the resolver) ..."
  ~/cairn-env/bin/pip install -q --no-deps "compressed-tensors==0.9.4"
  ~/cairn-env/bin/pip install -q pytest                  # the multinode / forward harnesses run under pytest
  ~/cairn-env/bin/python -c "import torch,sglang,transformers,compressed_tensors,sgl_kernel,cryptography; print('OK torch',torch.__version__,'cuda',torch.cuda.is_available(),'ct',compressed_tensors.__version__)" || true

envs:
  HF_TOKEN: ""
