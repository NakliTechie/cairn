# Cairn DeepSeek-V4-Flash (Path C) — multi-box layer-split via the 0xSero SM_120 community sglang patch.
#
# THIS IS THE MAIDEN MULTI-BOX V4 RUN. Scope of "see what happens" (per 2026-06-23 path-c decision):
#   (a) prove the 0xSero patch's SM_120 FlashMLA sparse-decode kernels survive Cairn's per-block sglang wrap
#       (i.e. the patch's sitecustomize hook fires inside our SglangNodeRuntime — Task #1 verdict)
#   (b) prove path-β loader (fork/shard/sglang_node.py + CAIRN_PP_{RANK,SIZE}) actually slices weights:
#       only ~50 GiB resident per box (vs the 149 GiB full checkpoint that wouldn't fit)
#   (c) drive ONE coherent decode through entry -> middle -> tail -> driver and confirm bit-shape
#   (d) test TAIL-KILL recovery — the existing 2-stage code path handles k_dead=N-1 without the
#       Task #3 N-stage driver refactor (deferred to a follow-on session per 2026-06-23 user call)
#
# OUT OF SCOPE for this run (gaps documented in workplan.md / pending.md):
#   • Middle-kill (rank 1): needs Task #3 driver refactor + serve.py lsock re-accept
#   • Entry-kill (rank 0): same + driver-side outbound re-stitch
#   • Reactive non-tail death: needs heartbeats (Path 2)
#
# Topology (N=3 layer-split + 1 tail-shaped spare = 4 nodes total):
#   rank0 = ENTRY  (layers 0..15)   + serve_http endpoint (OpenAI /v1 on :8000, co-located like cairn-serve.sky.yaml)
#   rank1 = MIDDLE (layers 15..29)
#   rank2 = TAIL   (layers 29..43)  — manual `pkill` / sentinel-drain demonstrates recovery
#   rank3 = SPARE  (layers 29..43)  — pre-warmed standby, takes over on tail death
# All four = g7e.2xlarge in eu-south-2 (Spain, $1.25/hr spot Linux/UNIX, <5% interruption — 2026-06-23 live).
# Total fleet ≈ $5/hr. Session ceiling = $30 (≤6h, see plan/workplan.md Chunk 0 + memory box-spinup-cost-gate).
#
# Launch (after `aws sso login --profile cairn-skypilot`):
#   set -a; source infra/secrets.env; set +a
#   sky launch -c cairn-dsv4 infra/skypilot/cairn-dsv4.sky.yaml --env HF_TOKEN --env SHARD_PSK \
#     --env CAIRN_API_KEY=sk-cairn-demo \
#     --env CAIRN_S3_CACHE_ACCESS_KEY_ID --env CAIRN_S3_CACHE_SECRET_ACCESS_KEY -i 60 --down -d
#   # (the two CAIRN_S3_CACHE_* vars pull weights from in-region S3 if present; absent → HF fallback)
#   ssh -L 8888:localhost:8000 cairn-dsv4 -N &
#   curl localhost:8888/v1/chat/completions -H 'authorization: Bearer sk-cairn-demo' \
#     -H 'content-type: application/json' \
#     -d '{"model":"deepseek-ai/DeepSeek-V4-Flash","messages":[{"role":"user","content":"hi"}],"max_tokens":48}'
#   # Tail-kill recovery test:
#   sky exec cairn-dsv4 "pkill -9 -f 'layer-start 29'"
#   # Drain-based recovery test (proactive path):
#   sky exec cairn-dsv4 "touch /tmp/cairn-drain"   # rank 2's sentinel watcher → graceful migrate
#   sky down cairn-dsv4

name: cairn-dsv4

num_nodes: 4                          # 3 active stages (rank 0/1/2) + 1 spare (rank 3)

resources:
  cloud: aws
  region: eu-south-2                  # SPAIN — $1.25/hr spot vs Seoul $1.43 (2026-06-23 live), <5% interruption
  instance_type: g7e.2xlarge          # 1× RTX PRO 6000 Blackwell (sm_120), 96 GiB VRAM
  use_spot: true
  disk_size: 400                      # 150 GiB V4-Flash FP8 + ~5 GiB 0xSero build + system + headroom
  # Blackwell DLAMI (R580 driver) — REQUIRED. SkyPilot's default Ubuntu AMI ships nvidia 535 which
  # cannot probe sm_120 ("probe of 0000:2b:00.0 failed with error -1"). Confirmed live 2026-06-23.
  # AMI IDs are PER-REGION (same build "Deep Learning Base OSS Nvidia Driver GPU AMI (Ubuntu 22.04)
  # 20260619"). This image_id matches the `region:` above (eu-south-2). To launch elsewhere, override
  # BOTH on the CLI: `sky launch --region <R> --image-id <ami>`. Known IDs (20260619 build):
  #   eu-south-2 (Spain) = ami-03cc3ae6c38cc7b29   ← matches this yaml
  #   us-east-2  (Ohio)  = ami-02584dd48f685760d   ← cheapest g7e spot 2026-06-24 ($1.193/box)
  #   ap-northeast-2 (Seoul) = ami-02f2234b443117395
  # Re-resolve per region: `aws ec2 describe-images --owners amazon --filters \
  #   "Name=name,Values=Deep Learning Base OSS Nvidia Driver GPU AMI (Ubuntu 22.04) 20260619"`
  #
  # us-east-2 (Ohio) + us-west-2 (Oregon) default-VPC FIXED 2026-06-24: their default VPCs had a
  # DETACHED internet gateway (igw-7f99db17 / igw-930aa8ea) still referenced by the main route table's
  # 0.0.0.0/0 → a blackhole route. Instances got public IPs but no internet path, so SkyPilot SSH setup
  # timed out (600s) on every box. Re-attached the IGWs via admin console → routes flipped blackhole→active.
  # Both NA regions are now usable for spot launches. (cairn-skypilot is least-priv & can't manage IGWs;
  # this was a one-time admin fix, not a policy change.) Ohio g7e is cheapest-in-world (~$1.19/box).
  image_id: ami-03cc3ae6c38cc7b29
  labels:
    cairn: "true"
    cairn-purpose: "dsv4-flash-pathc-maiden"

file_mounts:
  /cairn/fork: ./fork
  /cairn/cairn_node: ./cairn_node
  /cairn/configs: ./configs
  /cairn/infra: ./infra
  /cairn/scheduler/src: ./scheduler/src   # serve_http imports cairn_scheduler — only this dir (the parent's
  #                                          stray scheduler/.venv would rsync-choke SSH, see 2026-06-23 history)
  # 0xSero KERNEL CACHE (skips the ~30-min CUDA build on a fresh box). SkyPilot syncs this S3 prefix
  # to the box using the CONTROLLER's creds (the box itself has no instance role). Keyed by the base-
  # image digest — UPDATE this digest if `lmsysorg/sglang:deepseek-v4-blackwell` is re-pushed (the .so
  # is ABI-bound to that image's CUDA/python). Populate is a manual controller step (boxes can't write
  # S3): `aws s3 cp build-docker.tar.gz s3://skypilot-cairn-artifacts/dsv4-kernel/<digest>/`. If the
  # prefix is empty/missing, setup falls through to a full rebuild. See infra/skypilot/CACHING.md.
  /cairn-kernel-cache: s3://skypilot-cairn-artifacts/dsv4-kernel/408846afd1b0/

setup: |
  set -uo pipefail
  # 0xSero runs INSIDE the official lmsysorg/sglang:deepseek-v4-blackwell Docker image (the patch
  # replaces ONLY the SM_120 sparse-decode kernels in the upstream image; everything else stays).
  # So setup = pull the image + build the patch + pre-fetch weights. No host-side venv needed for
  # serving — cairn_node.serve runs INSIDE the container at run time.

  # 1. Docker (DLAMI already ships it but be defensive)
  if ! command -v docker >/dev/null; then
    curl -fsSL https://get.docker.com | sudo sh
    sudo systemctl enable --now docker
    sudo usermod -aG docker $USER
  fi
  # nvidia-container-toolkit (the DLAMI ships it but the runtime config sometimes needs a kick)
  sudo systemctl restart docker || true

  # 2. Pull the official Blackwell V4 sglang image (this is what 0xSero patches into)
  sudo docker pull lmsysorg/sglang:deepseek-v4-blackwell

  # 3. Build the 0xSero SM_120 patch (compiles inside the same container; output in ~/dsv4/build-docker)
  if [ ! -d ~/dsv4 ]; then
    git clone https://github.com/0xSero/deepseek-v4-flash-sm120 ~/dsv4
  fi
  cd ~/dsv4
  # Kernel acquisition, cheapest-first (maiden-run lesson — the build is ~30 min of g7e time):
  #   1. already built locally (sky-launch re-run on same cluster) → skip
  #   2. S3 cache hit (file_mount /cairn-kernel-cache, keyed by image digest) → extract (~seconds)
  #   3. cache miss → full CUDA build (then re-populate the cache from the controller, see CACHING.md)
  if ls ~/dsv4/build-docker/deepseek_v4_kernel/*.so >/dev/null 2>&1; then
    echo "[setup] 0xSero kernel .so already built locally — skipping"
  elif [ -f /cairn-kernel-cache/build-docker.tar.gz ]; then
    echo "[setup] restoring 0xSero kernel from S3 cache (skips the ~30-min build)"
    tar xzf /cairn-kernel-cache/build-docker.tar.gz -C ~/dsv4
    ls ~/dsv4/build-docker/deepseek_v4_kernel/*.so >/dev/null 2>&1 \
      && echo "[setup] kernel restored from cache" \
      || { echo "[setup] cache extract incomplete — falling back to build"; sudo bash scripts/build_in_sglang_docker.sh; }
  else
    echo "[setup] no local build, no S3 cache → building (~30 min)"
    sudo bash scripts/build_in_sglang_docker.sh
  fi

  # 4. Acquire FP8 weights, cheapest-first (2026-06-24 — download-once-to-S3, fan-out per CACHING.md):
  #    1. IN-REGION S3 cache hit → aws s3 sync over the AWS backbone (fast, no HF egress/rate-limits).
  #       Uses the cairn-s3-cache READ-ONLY key (CAIRN_S3_CACHE_*) — NOT the powerful cairn-skypilot key.
  #    2. miss → HF download (snapshot_download). huggingface_hub 1.x removed the .commands CLI path, so
  #       use the stable Python API (V4-Flash is public, no token). A miss = "lazy populate": the
  #       controller stages this region's bucket once before/after, so the NEXT launch here is a hit.
  mkdir -p ~/model
  export HF_HUB_ENABLE_HF_TRANSFER=1
  # auto-detect THIS box's region (IMDSv2) so we shop any region and still pull same-region S3
  _TOK=$(curl -sX PUT "http://169.254.169.254/latest/api/token" -H "X-aws-ec2-metadata-token-ttl-seconds: 120" 2>/dev/null)
  REGION=$(curl -s -H "X-aws-ec2-metadata-token: $_TOK" http://169.254.169.254/latest/meta-data/placement/region 2>/dev/null)
  S3="s3://skypilot-cairn-weights-${REGION}/deepseek-v4-flash/main"
  HIT=""
  if [ -n "${CAIRN_S3_CACHE_ACCESS_KEY_ID:-}" ] && command -v aws >/dev/null 2>&1; then
    if AWS_ACCESS_KEY_ID="$CAIRN_S3_CACHE_ACCESS_KEY_ID" AWS_SECRET_ACCESS_KEY="$CAIRN_S3_CACHE_SECRET_ACCESS_KEY" \
       aws s3 ls "$S3/config.json" --region "$REGION" >/dev/null 2>&1; then HIT=1; fi
  fi
  if [ -n "$HIT" ]; then
    echo "[setup] S3 cache HIT ($REGION) — syncing weights from $S3 (in-region backbone)"
    AWS_ACCESS_KEY_ID="$CAIRN_S3_CACHE_ACCESS_KEY_ID" AWS_SECRET_ACCESS_KEY="$CAIRN_S3_CACHE_SECRET_ACCESS_KEY" \
      aws s3 sync "$S3" ~/model --region "$REGION" --only-show-errors
  else
    echo "[setup] S3 cache MISS ($REGION) — downloading weights from HF (lazy-populate the bucket separately)"
    pip3 install -q --user "huggingface_hub[cli]" hf_transfer
    python3 -c "from huggingface_hub import snapshot_download; snapshot_download('deepseek-ai/DeepSeek-V4-Flash', local_dir='/home/ubuntu/model', max_workers=8)"
  fi

  # 5. Sanity checks
  nvidia-smi --query-gpu=name,memory.total,driver_version --format=csv,noheader || true
  ls -la ~/dsv4/build-docker/ || true
  du -sh ~/model || true

run: |
  set -uo pipefail
  RANK=${SKYPILOT_NODE_RANK}
  IPS=($SKYPILOT_NODE_IPS); IP0=${IPS[0]}; IP1=${IPS[1]}; IP2=${IPS[2]}; IP3=${IPS[3]}
  export SHARD_PSK=${SHARD_PSK:-cairn-fleet-psk}
  export CAIRN_SGLANG_MEM_FRACTION=${CAIRN_SGLANG_MEM_FRACTION:-0.85}
  MODEL=${MODEL:-deepseek-ai/DeepSeek-V4-Flash}
  API_KEY=${CAIRN_API_KEY:-sk-cairn-demo}
  NLAYERS=43

  # Path-β layer split (43 layers, N=3 → balanced front-loaded):
  #   rank 0: [0,15)   — entry, embeds tokens
  #   rank 1: [15,29)  — middle
  #   rank 2: [29,43)  — tail, applies norm + lm_head
  #   rank 3: [29,43)  — spare, tail-shaped for this run (first V4 test = tail-kill only)
  case "$RANK" in
    0) LS=0;  LE=15; PP_RANK=0; STAGE_NAME="entry"  ;;
    1) LS=15; LE=29; PP_RANK=1; STAGE_NAME="middle" ;;
    2) LS=29; LE=43; PP_RANK=2; STAGE_NAME="tail"   ;;
    3) LS=29; LE=43; PP_RANK=2; STAGE_NAME="spare"  ;;
  esac
  echo "[dsv4] rank=$RANK stage=$STAGE_NAME layers=[$LS,$LE) pp_rank=$PP_RANK"
  echo "[dsv4] ips: rank0=$IP0 rank1=$IP1 rank2=$IP2 rank3=$IP3"

  pkill -9 -f "[c]airn_node" 2>/dev/null || true; sleep 2

  # The common docker invocation: mount cairn + patch + weights, host network so ports work without -p,
  # pass HF_TOKEN + path-β env vars, run cairn_node.serve INSIDE the patched container.
  # WORKING DIR = /cairn so `python -u -m cairn_node.serve` resolves.
  # MOUNT FIX (2026-06-24 maiden run): SkyPilot file_mounts land the cairn dirs at
  # ~/.sky/file_mounts/cairn/ and put SYMLINKS at /cairn pointing there. Mounting `-v /cairn` into
  # docker carried in dangling symlinks (their target ~/.sky/... isn't mounted) → cairn_node
  # unimportable, serve crashed in 13s. Mount the REAL synced dir instead.
  DOCKER_RUN_COMMON="sudo docker run --rm --gpus all --shm-size=64g --ipc=host --network host \
    -v /home/ubuntu/dsv4/build-docker:/dsv4:ro \
    -v /home/ubuntu/model:/workspace/model:ro \
    -v /home/ubuntu/.sky/file_mounts/cairn:/cairn:ro \
    -w /cairn \
    -e PYTHONPATH=/dsv4:/cairn:/cairn/fork:/cairn/scheduler/src \
    -e HF_TOKEN=$HF_TOKEN \
    -e SHARD_PSK=$SHARD_PSK \
    -e CAIRN_SGLANG_MEM_FRACTION=$CAIRN_SGLANG_MEM_FRACTION \
    -e CAIRN_PP_RANK=$PP_RANK \
    -e CAIRN_PP_SIZE=3 \
    -e CAIRN_PP_LAYER_PARTITION=15,14,14 \
    lmsysorg/sglang:deepseek-v4-blackwell"
  # CAIRN_PP_LAYER_PARTITION = per-stage layer COUNTS; MUST match the case split above
  # (rank0 [0,15)=15, rank1 [15,29)=14, rank2 [29,43)=14). The loader pins sglang's
  # SGLANG_PP_LAYER_PARTITION to this so make_layers slices to exactly these boundaries (the
  # 2026-06-24 path-β fix — sglang's even-split default is remainder-LAST = 14,14,15, which would
  # NOT match this front-loaded split). Future: rebalance for MoE memory (experts ≫ dense layers).

  if [ "$RANK" = "0" ]; then
    # ENTRY (0..15) -> middle on $IP1:7777
    eval $DOCKER_RUN_COMMON \
      python -u -m cairn_node.serve --runtime sglang --model /workspace/model \
        --layer-start "$LS" --layer-end "$LE" --device cuda:0 \
        --listen-port 7777 --bind-host 0.0.0.0 --next-host "$IP1" --next-port 7777 \
        --stage-rank 0 \
      > /tmp/cairn-dsv4-rank0-entry.log 2>&1 &
    sleep 5   # give the entry a head start to bind :7777 before serve_http dials
    # serve_http endpoint (co-located on rank 0): dial local entry; accept tail-sink (7779) and
    # spare-sink (7780); serve OpenAI /v1 on :8000 with recovery armed for the tail-kill case.
    eval $DOCKER_RUN_COMMON \
      python -u -m cairn_node.serve_http --model "$MODEL" --port 8000 --bind 0.0.0.0 --api-key "$API_KEY" \
        --entry-host 127.0.0.1 --entry-port 7777 --tail-sink 7779 \
        --spare-host "$IP3" --spare-sink 7780 --spare-port 7777 \
      2>&1 | tee /tmp/cairn-dsv4-serve.log
  elif [ "$RANK" = "1" ]; then
    # MIDDLE (15..29) -> tail on $IP2:7777
    eval $DOCKER_RUN_COMMON \
      python -u -m cairn_node.serve --runtime sglang --model /workspace/model \
        --layer-start "$LS" --layer-end "$LE" --device cuda:0 \
        --listen-port 7777 --bind-host 0.0.0.0 --next-host "$IP2" --next-port 7777 \
        --stage-rank 1 \
      2>&1 | tee /tmp/cairn-dsv4-rank1-middle.log
  elif [ "$RANK" = "2" ]; then
    # TAIL (29..43) -> serve_http's tail-sink $IP0:7779. CAIRN_SPOT_TEST_FILE arms the proactive-drain
    # sentinel for the touch-based recovery test. The `exit 0` shim is REQUIRED (gang-scheduler trap
    # from 2026-06-23): if the tail dies with rc=137 the gang reaps serve_http mid-recovery, so we
    # report 0 and let serve_http's own death-detect kick off the re-stitch onto the spare.
    eval CAIRN_SPOT_TEST_FILE=/tmp/cairn-drain CAIRN_SPOT_WATCH_INTERVAL=0.5 \
      $DOCKER_RUN_COMMON \
      python -u -m cairn_node.serve --runtime sglang --model /workspace/model \
        --layer-start "$LS" --layer-end "$LE" --device cuda:0 \
        --listen-port 7777 --bind-host 0.0.0.0 --next-host "$IP0" --next-port 7779 \
        --stage-rank 2 \
      > /tmp/cairn-dsv4-rank2-tail.log 2>&1
    rc=$?; echo "[dsv4] tail exited rc=$rc (kill/drain) -> reporting 0 so the gang scheduler keeps serve_http alive"; exit 0
  else
    # SPARE (29..43, tail-shaped) -> serve_http's spare-sink $IP0:7780
    eval $DOCKER_RUN_COMMON \
      python -u -m cairn_node.serve --runtime sglang --model /workspace/model \
        --layer-start "$LS" --layer-end "$LE" --device cuda:0 \
        --listen-port 7777 --bind-host 0.0.0.0 --next-host "$IP0" --next-port 7780 \
        --stage-rank 2 \
      2>&1 | tee /tmp/cairn-dsv4-rank3-spare.log
  fi

envs:
  HF_TOKEN: ""
  SHARD_PSK: ""
  CAIRN_API_KEY: "sk-cairn-demo"
  # cairn-s3-cache READ-ONLY key (in secrets.env) → setup step 4 syncs weights from in-region S3.
  # Empty default ⇒ setup falls back to HF (so the yaml still works before the key exists).
  CAIRN_S3_CACHE_ACCESS_KEY_ID: ""
  CAIRN_S3_CACHE_SECRET_ACCESS_KEY: ""
