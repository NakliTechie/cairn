# Cairn DeepSeek-V4-Flash (Path C) — multi-box layer-split via the 0xSero SM_120 community sglang patch.
#
# THIS IS THE MAIDEN MULTI-BOX V4 RUN. Scope of "see what happens" (per 2026-06-23 path-c decision):
#   (a) prove the 0xSero patch's SM_120 FlashMLA sparse-decode kernels survive Cairn's per-block sglang wrap
#       (i.e. the patch's sitecustomize hook fires inside our SglangNodeRuntime — Task #1 verdict)
#   (b) prove path-β loader (fork/shard/sglang_node.py + CAIRN_PP_{RANK,SIZE}) actually slices weights:
#       only ~50 GiB resident per box (vs the 149 GiB full checkpoint that wouldn't fit)
#   (c) drive ONE coherent decode through entry -> middle -> tail -> driver and confirm bit-shape
#   (d) test TAIL-KILL recovery — the existing 2-stage code path handles k_dead=N-1 without the
#       Task #3 N-stage driver refactor (deferred to a follow-on session per 2026-06-23 user call)
#
# OUT OF SCOPE for this run (gaps documented in workplan.md / pending.md):
#   • Middle-kill (rank 1): needs Task #3 driver refactor + serve.py lsock re-accept
#   • Entry-kill (rank 0): same + driver-side outbound re-stitch
#   • Reactive non-tail death: needs heartbeats (Path 2)
#
# Topology (N=3 layer-split + 1 tail-shaped spare = 4 nodes total):
#   rank0 = ENTRY  (layers 0..15)   + serve_http endpoint (OpenAI /v1 on :8000, co-located like cairn-serve.sky.yaml)
#   rank1 = MIDDLE (layers 15..29)
#   rank2 = TAIL   (layers 29..43)  — manual `pkill` / sentinel-drain demonstrates recovery
#   rank3 = SPARE  (layers 29..43)  — pre-warmed standby, takes over on tail death
# All four = g7e.2xlarge in eu-south-2 (Spain, $1.25/hr spot Linux/UNIX, <5% interruption — 2026-06-23 live).
# Total fleet ≈ $5/hr. Session ceiling = $30 (≤6h, see plan/workplan.md Chunk 0 + memory box-spinup-cost-gate).
#
# Launch (after `aws sso login --profile cairn-skypilot`):
#   set -a; source infra/secrets.env; set +a
#   sky launch -c cairn-dsv4 infra/skypilot/cairn-dsv4.sky.yaml --env HF_TOKEN --env SHARD_PSK \
#     --env CAIRN_API_KEY=sk-cairn-demo \
#     --env CAIRN_S3_CACHE_ACCESS_KEY_ID --env CAIRN_S3_CACHE_SECRET_ACCESS_KEY -i 60 --down -d
#   # (the two CAIRN_S3_CACHE_* vars pull weights from in-region S3 if present; absent → HF fallback)
#   ssh -L 8888:localhost:8000 cairn-dsv4 -N &
#   curl localhost:8888/v1/chat/completions -H 'authorization: Bearer sk-cairn-demo' \
#     -H 'content-type: application/json' \
#     -d '{"model":"deepseek-ai/DeepSeek-V4-Flash","messages":[{"role":"user","content":"hi"}],"max_tokens":48}'
#   # Tail-kill recovery test:
#   sky exec cairn-dsv4 "pkill -9 -f 'layer-start 29'"
#   # Drain-based recovery test (proactive path):
#   sky exec cairn-dsv4 "touch /tmp/cairn-drain"   # rank 2's sentinel watcher → graceful migrate
#   sky down cairn-dsv4

name: cairn-dsv4

num_nodes: 5                          # 4 active FP8 stages (rank 0-3) + 1 generic warm SPARE (rank 4).
                                      # General rule: ranks 0..CAIRN_NWAY-1 are active; ranks >= NWAY are
                                      # warm spares. NWAY=4 (FP8) → 1 spare; NWAY=3 → 2 spares (warm_target=2).

# SHARED FLEET SECURITY GROUP (self-replenish SG-isolation fix, 2026-06-28). Pin the whole fleet to ONE
# named SG so that a REPLENISHED spare — which is launched as a SEPARATE SkyPilot cluster
# (cairn-dsv4-spare.sky.yaml) and would otherwise get its own isolated per-cluster SG — joins the SAME SG
# and is mutually reachable on the recovery wire (7777-7780). Without this, recovery to a replenished spare
# fails twice: the spare's :7780 announce hangs in SYN-SENT, and the predecessor stage's data dial to the
# spare's :7777 is blocked → driver read times out at recovery.py:309 (observed live). cairn-dsv4-spare.sky.yaml
# pins the SAME name. Pre-create the SG once per region with `bash infra/aws/ensure-fleet-sg.sh` (it opens
# :22 for provisioning + 7777-7780 across the VPC). Override globally via ~/.sky/config.yaml if you prefer.
config:
  aws:
    security_group_name: cairn-fleet

resources:
  cloud: aws
  region: eu-south-2                  # SPAIN — $1.25/hr spot vs Seoul $1.43 (2026-06-23 live), <5% interruption
  instance_type: g7e.2xlarge          # 1× RTX PRO 6000 Blackwell (sm_120), 96 GiB VRAM
  use_spot: true
  disk_size: 150                      # OS + small file_mounts + ~/dsv4 kernel build only. The ~294 GiB FP8
                                      # weights AND the ~82 GiB docker image now stage on the 1.7 TB NVMe
                                      # instance store (/opt/dlami/nvme) — see setup step 0 (2026-06-28).
                                      # (History: 400 overflowed the EBS root mid-sync 2026-06-27; bumped to
                                      # 600; then moved the big artifacts off EBS entirely → back to 150.)
  # Blackwell DLAMI (R580 driver) — REQUIRED. SkyPilot's default Ubuntu AMI ships nvidia 535 which
  # cannot probe sm_120 ("probe of 0000:2b:00.0 failed with error -1"). Confirmed live 2026-06-23.
  # AMI IDs are PER-REGION (same build "Deep Learning Base OSS Nvidia Driver GPU AMI (Ubuntu 22.04)
  # 20260619"). This image_id matches the `region:` above (eu-south-2). To launch elsewhere, override
  # BOTH on the CLI: `sky launch --region <R> --image-id <ami>`. Known IDs (20260619 build):
  #   eu-south-2 (Spain) = ami-03cc3ae6c38cc7b29   ← matches this yaml
  #   us-east-2  (Ohio)  = ami-02584dd48f685760d   ← cheapest g7e spot 2026-06-24 ($1.193/box)
  #   ap-northeast-2 (Seoul) = ami-02f2234b443117395
  # Re-resolve per region: `aws ec2 describe-images --owners amazon --filters \
  #   "Name=name,Values=Deep Learning Base OSS Nvidia Driver GPU AMI (Ubuntu 22.04) 20260619"`
  #
  # us-east-2 (Ohio) + us-west-2 (Oregon) default-VPC FIXED 2026-06-24: their default VPCs had a
  # DETACHED internet gateway (igw-7f99db17 / igw-930aa8ea) still referenced by the main route table's
  # 0.0.0.0/0 → a blackhole route. Instances got public IPs but no internet path, so SkyPilot SSH setup
  # timed out (600s) on every box. Re-attached the IGWs via admin console → routes flipped blackhole→active.
  # Both NA regions are now usable for spot launches. (cairn-skypilot is least-priv & can't manage IGWs;
  # this was a one-time admin fix, not a policy change.) Ohio g7e is cheapest-in-world (~$1.19/box).
  image_id: ami-03cc3ae6c38cc7b29
  labels:
    cairn: "true"
    cairn-purpose: "dsv4-flash-pathc-maiden"

file_mounts:
  /cairn/fork: ./fork
  /cairn/cairn_node: ./cairn_node
  /cairn/configs: ./configs
  /cairn/infra: ./infra
  /cairn/scheduler/src: ./scheduler/src   # serve_http imports cairn_scheduler — only this dir (the parent's
  #                                          stray scheduler/.venv would rsync-choke SSH, see 2026-06-23 history)
  # 0xSero KERNEL CACHE (skips the ~30-min CUDA build on a fresh box). SkyPilot syncs this S3 prefix
  # to the box using the CONTROLLER's creds (the box itself has no instance role). Keyed by the base-
  # image digest — UPDATE this digest if `lmsysorg/sglang:deepseek-v4-blackwell` is re-pushed (the .so
  # is ABI-bound to that image's CUDA/python). Populate is a manual controller step (boxes can't write
  # S3): `aws s3 cp build-docker.tar.gz s3://skypilot-cairn-artifacts/dsv4-kernel/<digest>/`. If the
  # prefix is empty/missing, setup falls through to a full rebuild. See infra/skypilot/CACHING.md.
  /cairn-kernel-cache: s3://skypilot-cairn-artifacts/dsv4-kernel/408846afd1b0

setup: |
  set -uo pipefail
  # 0xSero runs INSIDE the official lmsysorg/sglang:deepseek-v4-blackwell Docker image (the patch
  # replaces ONLY the SM_120 sparse-decode kernels in the upstream image; everything else stays).
  # So setup = pull the image + build the patch + pre-fetch weights. No host-side venv needed for
  # serving — cairn_node.serve runs INSIDE the container at run time.

  # 0. NVMe instance-store staging (2026-06-28): the Blackwell DLAMI auto-mounts the 1.7 TB local NVMe
  #    at /opt/dlami/nvme. Stage the ~294 GB FP8 weights AND the ~82 GB docker image there instead of the
  #    EBS root — it's free (included in the instance price) and multi-GB/s, so (a) disk_size drops
  #    600→150, and (b) the weight load + the N-stage recovery slice-reload ride NVMe bandwidth, not gp3
  #    EBS (the recovery design's fast-reload path; open throughput question in pending.md). Ephemeral
  #    (wiped on stop/terminate) — fine, we re-sync weights from S3 every launch. Falls back to the EBS
  #    root ($HOME) if the mount is absent (non-DLAMI AMI / instance with no local store) — in that case
  #    bump disk_size back up, since 150 GiB can't hold the weights.
  NVME=/opt/dlami/nvme
  if mountpoint -q "$NVME" 2>/dev/null; then
    sudo mkdir -p "$NVME/model" "$NVME/docker"
    sudo chown "$USER":"$USER" "$NVME/model"
    MODEL_DIR="$NVME/model"
    DOCKER_DATA_ROOT="$NVME/docker"
    echo "[setup] NVMe staging on $NVME ($(df -h "$NVME" | awk 'NR==2{print $4}') free) — weights + docker image land here"
  else
    mkdir -p "$HOME/model"
    MODEL_DIR="$HOME/model"
    DOCKER_DATA_ROOT=""
    echo "[setup] WARNING: NVMe instance store not mounted at $NVME — staging weights on EBS root ($MODEL_DIR); disk_size=150 will NOT fit 294 GiB, bump it"
  fi

  # 1. Docker (DLAMI already ships it but be defensive). Point its data-root at the NVMe instance store
  #    (when present) so the ~82 GB image extracts onto NVMe, not the EBS root — must precede any pull.
  if ! command -v docker >/dev/null; then
    curl -fsSL https://get.docker.com | sudo sh
    sudo systemctl enable --now docker
    sudo usermod -aG docker $USER
  fi
  if [ -n "$DOCKER_DATA_ROOT" ]; then
    sudo mkdir -p "$DOCKER_DATA_ROOT"
    # MERGE data-root into the existing daemon.json — do NOT clobber the nvidia-container-runtime block
    # the DLAMI registered there (overwriting it breaks `--gpus all` → "could not select device driver").
    sudo python3 -c "import json,os; p='/etc/docker/daemon.json'; d=(json.load(open(p)) if os.path.exists(p) and os.path.getsize(p)>0 else {}); d['data-root']='$DOCKER_DATA_ROOT'; json.dump(d, open(p,'w'), indent=2); print('[setup] daemon.json now:', d)"
    echo "[setup] docker data-root -> $DOCKER_DATA_ROOT (image on NVMe; nvidia runtime preserved)"
  fi
  # nvidia-container-toolkit (the DLAMI ships it but the runtime config sometimes needs a kick)
  sudo systemctl restart docker || true

  # 2–4 PARALLELIZED (2026-06-26): the image acquire, kernel restore, and the 159 GB in-region weight
  #     sync are independent I/O on different sources — running them serially left all 4 GPU boxes
  #     idle-billing through the SUM. Run image + weights CONCURRENTLY (logs to temp files so output
  #     isn't interleaved); the kernel restore overlaps both. The ONE real dependency is the kernel
  #     *build* fallback (compiles inside the image), so it's deferred until after the image is present.

  # 2. Acquire the Blackwell V4 sglang image — prefer the IN-REGION ECR mirror (skypilot-cairn cache),
  #    fall back to Docker Hub. A ~82 GB Docker Hub pull on every node is the dominant setup cost + a
  #    rate-limit risk; the ECR pull rides the AWS backbone and is layer-cached. Auth: the scoped cache
  #    key (CAIRN_S3_WRITE_*, via --env) — ECR read on the cairn-sglang repo.
  acquire_image() {
    local IMG="lmsysorg/sglang:deepseek-v4-blackwell"
    # Derive the ECR region from IMDS (same as acquire_weights) so the in-region mirror matches the
    # LAUNCH region — a hardcoded eu-south-2 forces a slow cross-region pull on every out-of-region box.
    local _TOK REGION
    _TOK=$(curl -sX PUT "http://169.254.169.254/latest/api/token" -H "X-aws-ec2-metadata-token-ttl-seconds: 120" 2>/dev/null)
    REGION=$(curl -s -H "X-aws-ec2-metadata-token: $_TOK" http://169.254.169.254/latest/meta-data/placement/region 2>/dev/null)
    local ECR_REGION="${REGION:-eu-south-2}"
    local ECR_REPO="AWS_ACCOUNT_ID.dkr.ecr.${ECR_REGION}.amazonaws.com/cairn-sglang"
    local ECR_IMG="${ECR_REPO}:deepseek-v4-blackwell"
    if sudo docker image inspect "$IMG" >/dev/null 2>&1; then
      echo "[setup] image $IMG already present locally — skipping pull (warm re-run)"; return
    fi
    if [ -n "${CAIRN_S3_WRITE_ACCESS_KEY_ID:-}" ] && command -v aws >/dev/null 2>&1 \
       && AWS_ACCESS_KEY_ID="$CAIRN_S3_WRITE_ACCESS_KEY_ID" AWS_SECRET_ACCESS_KEY="$CAIRN_S3_WRITE_SECRET_ACCESS_KEY" \
            aws ecr get-login-password --region "$ECR_REGION" 2>/dev/null \
            | sudo docker login --username AWS --password-stdin "$ECR_REPO" >/dev/null 2>&1 \
       && sudo docker pull "$ECR_IMG"; then
      sudo docker tag "$ECR_IMG" "$IMG"   # retag to the canonical name the run: block uses
      echo "[setup] image acquired from in-region ECR mirror ($ECR_IMG)"
    else
      echo "[setup] ECR mirror miss — pulling $IMG from Docker Hub (slower; mirror via infra/skypilot/cache-image.sh)"
      sudo docker pull "$IMG"
    fi
  }

  # 4. Acquire FP8 weights — IN-REGION S3 sync (cache hit, AWS backbone, no HF egress) else HF snapshot
  #    (lazy-populate: the controller stages this region's bucket once so the NEXT launch is a hit).
  acquire_weights() {
    mkdir -p "$MODEL_DIR"
    export HF_HUB_ENABLE_HF_TRANSFER=1
    local _TOK REGION S3
    _TOK=$(curl -sX PUT "http://169.254.169.254/latest/api/token" -H "X-aws-ec2-metadata-token-ttl-seconds: 120" 2>/dev/null)
    REGION=$(curl -s -H "X-aws-ec2-metadata-token: $_TOK" http://169.254.169.254/latest/meta-data/placement/region 2>/dev/null)
    S3="s3://skypilot-cairn-weights-${REGION}/deepseek-v4-flash-fp8/main"
    if [ -n "${CAIRN_S3_CACHE_ACCESS_KEY_ID:-}" ] && command -v aws >/dev/null 2>&1 \
       && AWS_ACCESS_KEY_ID="$CAIRN_S3_CACHE_ACCESS_KEY_ID" AWS_SECRET_ACCESS_KEY="$CAIRN_S3_CACHE_SECRET_ACCESS_KEY" \
            aws s3 ls "$S3/config.json" --region "$REGION" >/dev/null 2>&1; then
      echo "[setup] S3 cache HIT ($REGION) — syncing weights from $S3 to $MODEL_DIR (in-region backbone)"
      AWS_ACCESS_KEY_ID="$CAIRN_S3_CACHE_ACCESS_KEY_ID" AWS_SECRET_ACCESS_KEY="$CAIRN_S3_CACHE_SECRET_ACCESS_KEY" \
        aws s3 sync "$S3" "$MODEL_DIR" --region "$REGION" --only-show-errors
    else
      echo "[setup] S3 cache MISS ($REGION) — downloading weights from HF to $MODEL_DIR (lazy-populate the bucket separately)"
      pip3 install -q --user "huggingface_hub[cli]" hf_transfer
      python3 -c "from huggingface_hub import snapshot_download; snapshot_download('sgl-project/DeepSeek-V4-Flash-FP8', local_dir='$MODEL_DIR', max_workers=8)"
    fi
  }

  # Kick off image + weights CONCURRENTLY.
  acquire_image   > /tmp/setup-image.log   2>&1 &  PID_I=$!
  acquire_weights > /tmp/setup-weights.log 2>&1 &  PID_W=$!

  # 3. 0xSero SM_120 kernel — restore now if possible (independent of the image, ~seconds); else mark
  #    for build-after-image (the build runs INSIDE the image, so it must wait on the image pull).
  if [ ! -d ~/dsv4 ]; then git clone https://github.com/0xSero/deepseek-v4-flash-sm120 ~/dsv4; fi
  cd ~/dsv4
  NEED_BUILD=""
  if ls ~/dsv4/build-docker/deepseek_v4_kernel/*.so >/dev/null 2>&1; then
    echo "[setup] 0xSero kernel .so already built locally — skipping"
  elif [ -f /cairn-kernel-cache/build-docker.tar.gz ]; then
    echo "[setup] restoring 0xSero kernel from S3 cache (skips the ~30-min build)"
    tar xzf /cairn-kernel-cache/build-docker.tar.gz -C ~/dsv4
    ls ~/dsv4/build-docker/deepseek_v4_kernel/*.so >/dev/null 2>&1 \
      && echo "[setup] kernel restored from cache" || NEED_BUILD=1
  else
    NEED_BUILD=1
  fi

  # Barrier: both background downloads must complete before the run (and before any build).
  echo "[setup] waiting for concurrent image + weights downloads ..."
  wait "$PID_I"; RC_I=$?; cat /tmp/setup-image.log
  wait "$PID_W"; RC_W=$?; cat /tmp/setup-weights.log
  if [ "$RC_I" -ne 0 ] || [ "$RC_W" -ne 0 ]; then
    echo "[setup] FATAL: image rc=$RC_I weights rc=$RC_W"; exit 1
  fi

  if [ -n "$NEED_BUILD" ]; then
    echo "[setup] no local/cache kernel hit → building 0xSero kernel (~30 min, inside the image) ..."
    sudo bash scripts/build_in_sglang_docker.sh
  fi

  # 5. Sanity checks
  nvidia-smi --query-gpu=name,memory.total,driver_version --format=csv,noheader || true
  ls -la ~/dsv4/build-docker/ || true
  du -sh "$MODEL_DIR" || true
  df -h "$MODEL_DIR" / | sed 's/^/[setup][disk] /' || true

  # 6. SELF-REPLENISH prep (opt-in via CAIRN_SELF_REPLENISH; rank0 only). The host-side replenish-watcher
  #    provisions replacement spares with `sky launch`, so rank0 needs `sky` + a launch key. Install a
  #    dedicated sky venv (off the DLAMI python); the launch key arrives via --env CAIRN_LAUNCH_AWS_* (the
  #    scoped cairn-skypilot key for the test, or the narrower cairn-spare-launcher in prod). If
  #    SKYPILOT_NODE_RANK is unset in setup, all nodes install (harmless; only rank0 runs the watcher).
  if [ -n "${CAIRN_SELF_REPLENISH:-}" ] && [ "${SKYPILOT_NODE_RANK:-0}" = "0" ]; then
    echo "[setup] self-replenish: installing a sky venv on the box for provisioning replacement spares ..."
    python3 -m venv ~/.cairn-box-sky 2>/dev/null || true
    ~/.cairn-box-sky/bin/pip install -q --upgrade pip 2>/dev/null || true
    if ~/.cairn-box-sky/bin/pip install -q "skypilot[aws]" 2>/tmp/sky-install.log; then
      AWS_ACCESS_KEY_ID="${CAIRN_LAUNCH_AWS_ACCESS_KEY_ID:-}" AWS_SECRET_ACCESS_KEY="${CAIRN_LAUNCH_AWS_SECRET_ACCESS_KEY:-}" \
        ~/.cairn-box-sky/bin/sky check aws 2>&1 | tail -2 || true
      echo "[setup] sky installed for self-replenish (~/.cairn-box-sky/bin/sky)"
    else
      echo "[setup] WARN: sky install failed (see /tmp/sky-install.log) — self-replenish provisioning disabled"
    fi
  fi

run: |
  set -uo pipefail
  RANK=${SKYPILOT_NODE_RANK}
  IPS=($SKYPILOT_NODE_IPS); IP0=${IPS[0]}; IP1=${IPS[1]}; IP2=${IPS[2]}; IP3=${IPS[3]}
  export SHARD_PSK=${SHARD_PSK:-cairn-fleet-psk}
  export CAIRN_SGLANG_MEM_FRACTION=${CAIRN_SGLANG_MEM_FRACTION:-0.85}
  MODEL=${MODEL:-sgl-project/DeepSeek-V4-Flash-FP8}
  API_KEY=${CAIRN_API_KEY:-sk-cairn-demo}
  NLAYERS=43

  # Weights live on the NVMe instance store when setup staged them there (2026-06-28), else the EBS root.
  MODEL_DIR=/home/ubuntu/model
  [ -d /opt/dlami/nvme/model ] && MODEL_DIR=/opt/dlami/nvme/model
  echo "[dsv4] weights mounted from $MODEL_DIR"

  # Topology via CAIRN_NWAY (default 4 — FP8 needs 4-way; 3-way OOMs, GPU-confirmed 2026-06-28). Path-β
  # layer split over 43 layers. Ranks 0..NWAY-1 are ACTIVE; ranks >= NWAY are generic warm SPARES.
  #   NWAY=4 (5 boxes) → 11,11,11,10 active + 1 spare (rank4)   [the resilience topology]
  #   NWAY=3 (5 boxes) → 15,14,14 active + 2 spares (rank3,4)   [warm_target=2]
  # WARM RE-SLICE: `sky exec cairn-dsv4 <this yaml> --env CAIRN_NWAY=N` re-runs ONLY this block on the live
  # cluster — each box reloads its NEW slice from on-disk weights (~5-8 min, no S3 re-sync) vs ~40-min cold.
  NWAY=${CAIRN_NWAY:-4}
  NTOTAL=${#IPS[@]}
  NSPARES=$(( NTOTAL - NWAY ))               # generic warm spares: any-position recovery + self-replenish
  if [ "$NWAY" = "3" ]; then PART=15,14,14;   STARTS=(0 15 29);    ENDS=(15 29 43)
  else NWAY=4;               PART=11,11,11,10; STARTS=(0 11 22 33); ENDS=(11 22 33 43); fi
  PP_SIZE=$NWAY; LAST_ACTIVE=$(( NWAY - 1 ))

  if [ "$RANK" -ge "$NWAY" ]; then
    # GENERIC WARM SPARE — shaped for CAIRN_SPARE_RANK (default = tail). NOTE: one spare covering ANY
    # position needs load-on-promotion (reload slice k from NVMe on promotion — GPU-only follow-up); a
    # SHAPED spare covers its position now, which is enough to test the warm/hot swap + metrics per position.
    SR=${CAIRN_SPARE_RANK:-$LAST_ACTIVE}
    LS=${STARTS[$SR]}; LE=${ENDS[$SR]}; PP_RANK=$SR; STAGE_NAME="spare(for-rank-$SR)"
    NEXT_HOST=$IP0; NEXT_PORT=7780           # spare → serve_http spare-sink
  else
    LS=${STARTS[$RANK]}; LE=${ENDS[$RANK]}; PP_RANK=$RANK; STAGE_NAME="stage$RANK"
    if [ "$RANK" = "$LAST_ACTIVE" ]; then NEXT_HOST=$IP0; NEXT_PORT=7779    # tail → serve_http tail-sink
    else NIDX=$((RANK+1)); NEXT_HOST=${IPS[$NIDX]}; NEXT_PORT=7777; fi        # middle → next stage
  fi
  echo "[dsv4] NWAY=$NWAY ntotal=$NTOTAL nspares=$NSPARES rank=$RANK ($STAGE_NAME) layers=[$LS,$LE) pp=$PP_RANK part=$PART -> $NEXT_HOST:$NEXT_PORT"

  pkill -9 -f "[c]airn_node" 2>/dev/null || true
  # Warm re-slice / re-exec hygiene: a cancelled `sky` job can leave --rm docker containers running
  # (the daemon owns them, not the killed run shell), holding :7777/:8000 + the GPU. Clear them so the
  # new stage can bind + claim the device.
  sudo docker kill $(sudo docker ps -q) 2>/dev/null || true; sleep 3

  # SELF-REPLENISH plumbing (rank0, opt-in via CAIRN_SELF_REPLENISH). serve_http writes to /shared/...req
  # (mounted from the host /tmp/cairn-shared); a host-side watcher launches a replacement spare box. The
  # watcher needs `sky` + a scoped launch key ON THIS BOX (infra/aws/cairn-spare-launch-policy.json) —
  # an admin step, so this stays opt-in. The serving container only WRITES the request (no creds in it).
  sudo mkdir -p /tmp/cairn-shared && sudo chmod 777 /tmp/cairn-shared
  if [ "$RANK" = "0" ] && [ -n "${CAIRN_SELF_REPLENISH:-}" ]; then
    export CAIRN_REPLENISH_CMD="echo provision >> /shared/cairn-replenish-req"
  fi

  # The common docker invocation: mount cairn + patch + weights, host network so ports work without -p,
  # pass HF_TOKEN + path-β env vars, run cairn_node.serve INSIDE the patched container.
  # WORKING DIR = /cairn so `python -u -m cairn_node.serve` resolves.
  # MOUNT FIX (2026-06-24 maiden run): SkyPilot file_mounts land the cairn dirs at
  # ~/.sky/file_mounts/cairn/ and put SYMLINKS at /cairn pointing there. Mounting `-v /cairn` into
  # docker carried in dangling symlinks (their target ~/.sky/... isn't mounted) → cairn_node
  # unimportable, serve crashed in 13s. Mount the REAL synced dir instead.
  # The -e SGLANG_OPT_* / TORCH_CUDA_ARCH_LIST block below = 0xSero's REQUIRED sm_120 env
  # (DEEPSEEK-V4-FLASH.md "Required mounts and environment"). They route the indexer / SWA-prepare /
  # MHC / paged-MQA-logits kernels to TileLang/torch impls that support Blackwell sm_120. The .so patch
  # only covers sparse-DECODE; WITHOUT SGLANG_OPT_USE_TILELANG_INDEXER=1 the C4 indexer falls through to
  # csrc/apis/attention.hpp -> "Unsupported architecture" (GPU-confirmed 2026-06-26). Cairn drives sglang
  # directly but these are read globally at kernel-dispatch time.
  #   NB: 0xSero's SGLANG_DSV4_FP4_EXPERTS=0 is deliberately OMITTED. They run TP=4 (experts sharded
  #   across 4 GPUs) so can afford full-precision experts; Cairn is TP=1 + LAYER-split (each box holds
  #   ALL experts for its slice), so disabling FP4 OOMs the box (GPU-confirmed: 94.36/95 GiB in MoE
  #   create_weights). Left at the checkpoint default -> the proven ~58 GiB/box load.
  DOCKER_RUN_COMMON="sudo docker run --rm --gpus all --shm-size=64g --ipc=host --network host \
    -v /home/ubuntu/dsv4/build-docker:/dsv4:ro \
    -v $MODEL_DIR:/workspace/model:ro \
    -v /home/ubuntu/.sky/file_mounts/cairn:/cairn:ro \
    -v /tmp/cairn-shared:/shared \
    -e CAIRN_SELF_REPLENISH=${CAIRN_SELF_REPLENISH:-} \
    -w /cairn \
    -e PYTHONPATH=/dsv4:/cairn:/cairn/fork:/cairn/scheduler/src \
    -e HF_TOKEN=$HF_TOKEN \
    -e SHARD_PSK=$SHARD_PSK \
    -e CAIRN_SGLANG_MEM_FRACTION=$CAIRN_SGLANG_MEM_FRACTION \
    -e CAIRN_PP_RANK=$PP_RANK \
    -e CAIRN_PP_SIZE=$PP_SIZE \
    -e CAIRN_PP_LAYER_PARTITION=$PART \
    -e TORCH_CUDA_ARCH_LIST=12.0 \
    -e FLASHINFER_DISABLE_VERSION_CHECK=1 \
    -e SGLANG_ENABLE_JIT_DEEPGEMM=0 \
    -e SGLANG_JIT_DEEPGEMM_PRECOMPILE=0 \
    -e SGLANG_OPT_DEEPGEMM_HC_PRENORM=0 \
    -e SGLANG_OPT_USE_TILELANG_INDEXER=1 \
    -e SGLANG_FP8_PAGED_MQA_LOGITS_TORCH=1 \
    -e SGLANG_OPT_USE_TILELANG_SWA_PREPARE=1 \
    -e SGLANG_OPT_USE_TILELANG_MHC_PRE=1 \
    -e SGLANG_OPT_USE_TILELANG_MHC_POST=1 \
    -e SGLANG_OPT_CACHE_SWA_TRANSLATION=0 \
    -e CAIRN_DEBUG_MOE=1 \
    -e CAIRN_SPOT_WATCH=1 \
    -e CAIRN_SPOT_TEST_FILE=/shared/drain \
    -e CAIRN_SPOT_WATCH_INTERVAL=0.5 \
    -e CAIRN_REPLENISH_CMD=\"${CAIRN_REPLENISH_CMD:-}\" \
    -e CAIRN_ALERT_WEBHOOK=$CAIRN_ALERT_WEBHOOK \
    -e CALLMEBOT_PHONE=$CALLMEBOT_PHONE \
    -e CALLMEBOT_APIKEY=$CALLMEBOT_APIKEY \
    lmsysorg/sglang:deepseek-v4-blackwell"
  # CAIRN_PP_LAYER_PARTITION ($PART) = per-stage layer COUNTS; MUST match the case split above
  # (3-way 15,14,14 ; 4-way 11,11,11,10). The loader pins sglang's SGLANG_PP_LAYER_PARTITION to this so
  # make_layers slices to exactly these boundaries (the 2026-06-24 path-β fix — sglang's even-split
  # default is remainder-LAST, which would NOT match a front-loaded split). Future: rebalance for MoE
  # memory (experts ≫ dense layers) once a topology fits.

  # Common per-stage args (next-hop already resolved per topology above).
  STAGE_ARGS="--runtime sglang --model /workspace/model --layer-start $LS --layer-end $LE --device cuda:0 \
    --listen-port 7777 --bind-host 0.0.0.0 --next-host $NEXT_HOST --next-port $NEXT_PORT --stage-rank $PP_RANK"

  if [ "$RANK" -ge "$NWAY" ]; then
    # GENERIC WARM SPARE: --announce my routable IP so the driver learns where to dial to PROMOTE me
    # (essential for REPLENISHED spares — a fresh box has a new IP). Shaped for CAIRN_SPARE_RANK; loaded +
    # flashinfer pre-warmed at launch so promotion is fast. Forwards to serve_http's spare-sink ($IP0:7780).
    eval $DOCKER_RUN_COMMON \
      python -u -m cairn_node.serve $STAGE_ARGS --announce --advertise-host "${IPS[$RANK]}" \
      2>&1 | tee /tmp/cairn-dsv4-rank${RANK}-spare.log
  elif [ "$RANK" = "0" ]; then
    # ENTRY + co-located serve_http (OpenAI /v1 on :8000) with N-STAGE recovery + the warm-spare pool.
    eval $DOCKER_RUN_COMMON \
      python -u -m cairn_node.serve $STAGE_ARGS \
      > /tmp/cairn-dsv4-rank0-entry.log 2>&1 &
    sleep 5   # give the entry a head start to bind :7777 before serve_http dials
    RECOVERY_ARGS=""
    if [ "$NSPARES" -gt 0 ]; then
      STAGE_HOSTS=$(IFS=,; echo "${IPS[*]:0:$NWAY}")     # IP0..IP_{NWAY-1} — for any-position re-stitch
      # --stage-partition enables LOAD-ON-PROMOTION: a generic spare re-execs to load slice k from NVMe so
      # ONE spare covers any position. (Without it, a spare only covers the position it was shaped for.)
      RECOVERY_ARGS="--stage-hosts $STAGE_HOSTS --stage-port 7777 --stage-partition $PART \
        --spare-host ${IPS[$NWAY]} --spare-sink 7780 --spare-port 7777 \
        --initial-spares $NSPARES --warm-target $NSPARES"
      # self-replenish provisions a NEW box (sky launch + scoped creds) on the HOST, not in this container
      # → opt-in via CAIRN_SELF_REPLENISH (+ a host-side watcher started below + a launch key on the box).
      [ -n "${CAIRN_SELF_REPLENISH:-}" ] && RECOVERY_ARGS="$RECOVERY_ARGS --self-replenish"
    fi
    # Host-side self-replenish watcher (opt-in). Needs `sky` + a scoped launch key on this box
    # (infra/aws/cairn-spare-launch-policy.json) — admin step, hence opt-in.
    if [ -n "${CAIRN_SELF_REPLENISH:-}" ]; then
      : > /tmp/cairn-shared/cairn-replenish-req
      _TOK=$(curl -sX PUT "http://169.254.169.254/latest/api/token" -H "X-aws-ec2-metadata-token-ttl-seconds: 120" 2>/dev/null)
      _REGION=$(curl -s -H "X-aws-ec2-metadata-token: $_TOK" http://169.254.169.254/latest/meta-data/placement/region 2>/dev/null)
      _AMI=$(curl -s -H "X-aws-ec2-metadata-token: $_TOK" http://169.254.169.254/latest/meta-data/ami-id 2>/dev/null)
      # The watcher launches replacement spares with `sky` (box venv) using the launch key (CAIRN_LAUNCH_AWS_*),
      # matching THIS box's region + AMI, and passing the weight/image creds through to the spare's setup.
      DRIVER_PRIVATE_IP="$IP0" CAIRN_SPARE_RANK="${CAIRN_SPARE_RANK:-}" \
      CAIRN_REPLENISH_REQ=/tmp/cairn-shared/cairn-replenish-req \
      CAIRN_PROJECT_DIR=/home/ubuntu/.sky/file_mounts/cairn \
      SKY_BIN="${SKY_BIN:-$HOME/.cairn-box-sky/bin/sky}" \
      CAIRN_REGION="${CAIRN_REGION:-$_REGION}" CAIRN_IMAGE_ID="${CAIRN_IMAGE_ID:-$_AMI}" \
      AWS_ACCESS_KEY_ID="${CAIRN_LAUNCH_AWS_ACCESS_KEY_ID:-}" AWS_SECRET_ACCESS_KEY="${CAIRN_LAUNCH_AWS_SECRET_ACCESS_KEY:-}" \
      HF_TOKEN="${HF_TOKEN:-}" SHARD_PSK="${SHARD_PSK:-}" \
      CAIRN_S3_CACHE_ACCESS_KEY_ID="${CAIRN_S3_CACHE_ACCESS_KEY_ID:-}" CAIRN_S3_CACHE_SECRET_ACCESS_KEY="${CAIRN_S3_CACHE_SECRET_ACCESS_KEY:-}" \
      CAIRN_S3_WRITE_ACCESS_KEY_ID="${CAIRN_S3_WRITE_ACCESS_KEY_ID:-}" CAIRN_S3_WRITE_SECRET_ACCESS_KEY="${CAIRN_S3_WRITE_SECRET_ACCESS_KEY:-}" \
        nohup bash /home/ubuntu/.sky/file_mounts/cairn/infra/skypilot/replenish-watcher.sh \
        > /tmp/cairn-replenish-watcher.log 2>&1 &
      echo "[dsv4] self-replenish watcher started (host-side) — /tmp/cairn-replenish-watcher.log"
    fi
    eval $DOCKER_RUN_COMMON \
      python -u -m cairn_node.serve_http --model "$MODEL" --port 8000 --bind 0.0.0.0 --api-key "$API_KEY" \
        --entry-host 127.0.0.1 --entry-port 7777 --tail-sink 7779 $RECOVERY_ARGS \
      2>&1 | tee /tmp/cairn-dsv4-serve.log
  elif [ "$RANK" = "$LAST_ACTIVE" ]; then
    # TAIL -> serve_http's tail-sink ($IP0:7779). The proactive-drain sentinel (CAIRN_SPOT_TEST_FILE=/shared/drain)
    # is now armed on ALL ranks via DOCKER_RUN_COMMON — touch /tmp/cairn-shared/drain on a box to drain THAT rank
    # (the host dir is bind-mounted to the container's /shared). The `exit 0` shim is REQUIRED (gang-scheduler
    # trap, 2026-06-23): a tail rc=137 would reap serve_http mid-recovery, so report 0 and let serve_http
    # drive the re-stitch.
    eval $DOCKER_RUN_COMMON \
      python -u -m cairn_node.serve $STAGE_ARGS \
      > /tmp/cairn-dsv4-rank${RANK}-tail.log 2>&1
    rc=$?; echo "[dsv4] tail (rank $RANK) exited rc=$rc (kill/drain) -> reporting 0 so the gang scheduler keeps serve_http alive"; exit 0
  else
    # MIDDLE (active rank 1..LAST_ACTIVE-1) → forwards to the next stage's :7777.
    eval $DOCKER_RUN_COMMON \
      python -u -m cairn_node.serve $STAGE_ARGS \
      2>&1 | tee /tmp/cairn-dsv4-rank${RANK}-stage.log
  fi

envs:
  HF_TOKEN: ""
  SHARD_PSK: ""
  CAIRN_API_KEY: "sk-cairn-demo"
  # Recovery topology knobs (read in the run block). NWAY active stages; the rest (num_nodes - NWAY) are
  # generic warm spares. CAIRN_SPARE_RANK shapes the spare (which position it can replace; default = tail).
  # Self-replenish provisions a replacement on consumption — opt-in (the replenish cmd runs host-side).
  CAIRN_NWAY: "4"                       # FP8 needs 4-way (3-way OOMs)
  CAIRN_SPARE_RANK: ""                  # which rank the spare is shaped for (default: tail = NWAY-1)
  CAIRN_SELF_REPLENISH: ""             # non-empty → serve_http launches a replacement spare on consumption
  CAIRN_REPLENISH_CMD: ""             # shell cmd that provisions one replacement spare (host-side sky + creds)
  # Launch key for the host-side replenish-watcher's `sky launch` (the scoped cairn-skypilot key for the
  # test, or the narrower cairn-spare-launcher in prod). Pass via --env from your shell; empty → no provisioning.
  CAIRN_LAUNCH_AWS_ACCESS_KEY_ID: ""
  CAIRN_LAUNCH_AWS_SECRET_ACCESS_KEY: ""
  # cairn-s3-cache READ-ONLY key (in secrets.env) → setup step 4 syncs weights from in-region S3.
  # Empty default ⇒ setup falls back to HF (so the yaml still works before the key exists).
  CAIRN_S3_CACHE_ACCESS_KEY_ID: ""
  CAIRN_S3_CACHE_SECRET_ACCESS_KEY: ""
  # cairn-s3-populate scoped cache key (in secrets.env as CAIRN_S3_WRITE_*) → setup step 2 pulls the
  # Blackwell image from the in-region ECR mirror (cairn-sglang). Empty ⇒ falls back to Docker Hub.
  CAIRN_S3_WRITE_ACCESS_KEY_ID: ""
  CAIRN_S3_WRITE_SECRET_ACCESS_KEY: ""
  # Signal-back-to-us on a spot reclaim (cairn_node.notify). CAIRN_SPOT_WATCH=1 is set in DOCKER_RUN_COMMON
  # so each box polls IMDS for its own ~2-min interruption notice; on a notice it drains AND fires this
  # alert. Set ONE channel in secrets.env (empty ⇒ box-side drain still works, just no remote ping):
  #   CAIRN_ALERT_WEBHOOK=https://ntfy.sh/<unguessable-topic>   (zero-setup; or a Slack/Discord webhook)
  #   or CALLMEBOT_PHONE + CALLMEBOT_APIKEY                     (WhatsApp)
  CAIRN_ALERT_WEBHOOK: ""
  CALLMEBOT_PHONE: ""
  CALLMEBOT_APIKEY: ""
