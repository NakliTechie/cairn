# Cairn GPU box image — VERIFIED LOCK (the exact env that ran the rung-2 SGLang block-forward green).
#
# Captured via `pip freeze` from the live g6.xlarge/L4 box on 2026-06-21, after test_sglang_split.py
# passed (split==unsplit + replay-rebuild on real flashinfer kernels). This is the reproducible
# source of truth — `pip install -r infra/requirements.lock` recreates the working env exactly.
#
# It encodes three corrections that requirements-gpu.txt's original pins got wrong (each found on the box):
#   - sglang[srt] (not bare sglang) → the runtime extra: sgl-kernel 0.1.4 + flashinfer 0.2.5 + transformers.
#   - torch==2.6.0 (sglang 0.4.6.post5 requires it; it overrode a pre-pinned 2.5.1).
#   - compressed-tensors==0.9.4 (sglang pulls 0.15+, which imports transformers.masking_utils — absent in
#     the transformers==4.51.1 sglang pins — breaking ALL model loading; 0.9.4 is the last pre-masking_utils).
# The path-C oracle's transformers 5.x lives in a SEPARATE env (infra/requirements-ref.txt) — do not mix.
#
# Box prerequisites for flashinfer JIT (not pip): the CUDA toolkit (nvcc, /usr/local/cuda) + ninja on PATH.
# TODO(hardening, M12): regenerate with `--require-hashes` (pip-compile/uv) for supply-chain integrity.

