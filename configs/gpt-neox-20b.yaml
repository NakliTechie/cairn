# Cairn model-as-config — GPT-NeoX-20B (COMPARABILITY model: SpotServe's exact 20B).
#
# WHY: SpotServe (ASPLOS '24) evaluated OPT-6.7B / GPT-NeoX-20B / LLaMA-30B. NeoX-20B is the clean
# one (Apache-2.0), so it's the head-to-head: reproduce SpotServe's methodology (real spot trace,
# on-demand baseline, P99 + cost/token) and compare Cairn's fixed-block + replay-KV recovery vs
# SpotServe's reparallelize-and-migrate. Target: <= their published 54% on-demand cost.
# SpotServe ran fp16 on AWS g4dn (T4); we run fp16 on g6 (L4, T4's successor). See plan/prior-art.md.
# Dense model — splits even more simply than the MoE proof/headline (no expert routing).

name: gpt-neox-20b
source:
  hf_repo: EleutherAI/gpt-neox-20b
license: Apache-2.0

arch:
  num_layers: 44
  hidden_size: 6144
  num_attention_heads: 64
  num_key_value_heads: 64      # MHA (no GQA)
  head_dim: 96
  vocab_size: 50432
  num_local_experts: 0         # dense
  num_experts_per_tok: 0
  intermediate_size: 24576
  max_context: 2048
  sliding_window: null
  rope_theta: 10000            # partial rotary (rotary_pct 0.25)
  tie_word_embeddings: false

quant:
  method: fp16                 # full precision — matches SpotServe's eval

precision:
  kv_dtype: float16
  embedding_dtype: float16
  kv_model: full

footprint:
  total_weight_bytes: 41478235168   # ~38.6 GiB fp16 (20.74B params x 2). MEASURE on the box.

overheads:
  framework_overhead_bytes: 3221225472   # ~3 GiB. TODO measure on L4.
  activation_buffer_bytes: 536870912     # ~0.5 GiB. TODO measure.

fit_defaults:
  target_k: 8
  max_context: 2048

pool:
  instance_type: g6.xlarge
  region: eu-south-2           # comparability runs in Spain (cheap g6); cite SpotServe's T4 numbers as the reference
  gpu: L4
  gpu_vram_bytes: 25769803776  # 24 GiB
  gpu_count_per_node: 1
