# Cairn model-as-config — gpt-oss-120b (v1.0 proof model).
#
# Spec invariant #3: "model is configuration". A new model is a new YAML, never a
# new code path. The scheduler/fit reads ONLY this file to place the model on a pool.
#
# Architecture values are verbatim from openai/gpt-oss-120b config.json (HF).
# License: Apache-2.0 (+ gpt-oss usage policy) — confirmed, v0 gate cleared.

name: gpt-oss-120b
source:
  hf_repo: openai/gpt-oss-120b
license: Apache-2.0           # + acceptable-use "gpt-oss usage policy" overlay

arch:
  num_layers: 36
  hidden_size: 2880
  num_attention_heads: 64
  num_key_value_heads: 8       # GQA — drives KV-cache size (8, not 64)
  head_dim: 64
  vocab_size: 201088
  num_local_experts: 128       # MoE; experts+router live wholly intra-stage (inv #1)
  num_experts_per_tok: 4
  intermediate_size: 2880
  max_context: 131072          # 128K
  sliding_window: 128          # alternate layers are SWA — KV-capped (see precision.kv_model)
  rope_theta: 150000
  tie_word_embeddings: false   # ASSUMPTION (separate unembedding; excluded from MXFP4). TODO verify.

quant:
  method: mxfp4                # MoE expert weights MXFP4; attention/router/embedding/lm_head kept higher precision

precision:
  kv_dtype: float16            # KV-cache precision — a fit input
  embedding_dtype: bfloat16    # embedding + lm_head precision (not MXFP4)
  kv_model: full               # full | swa-aware. v1.0 = conservative full-attention upper bound.
                               # TODO refine: half the layers are SWA(128) → large KV saving on long contexts (spec §12.2).

footprint:
  total_weight_bytes: 67645734912   # ~63 GiB MXFP4 (spec §3). Whole-model weights incl. embedding+lm_head.
  # per_layer_weight_bytes: [...]   # optional per-layer override (MoE layers vary); omitted → uniform estimate.

# §12 calc inputs — these are the "resolve at build on real hardware" numbers.
# Values below are DOCUMENTED PLACEHOLDERS (conservative); measure on a real L4 before the v1.0 fit.
overheads:
  framework_overhead_bytes: 3221225472   # ~3 GiB: CUDA context + torch/SGLang reserved. TODO measure.
  activation_buffer_bytes: 536870912     # ~0.5 GiB: per-stage activation + scratch. TODO measure.

fit_defaults:
  target_k: 8                  # concurrent streams to reserve KV headroom for (spec §3/§4.2; K_min = N)
  max_context: 8192            # context length to size KV headroom against for the fit (NOT the 128K ceiling)

pool:
  instance_type: g6.xlarge
  region: eu-south-2           # proof runs in Spain (g6 spot <5% interruption, 3 AZs)
  gpu: L4
  gpu_vram_bytes: 25769803776  # 24 GiB
  gpu_count_per_node: 1
