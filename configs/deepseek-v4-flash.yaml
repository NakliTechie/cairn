# Cairn model-as-config — DeepSeek-V4-Flash (NVFP4 4-bit, second DSA headline alongside GLM-5.2).
#
# Arch verbatim from deepseek-ai/DeepSeek-V4-Flash config.json (HF). License: MIT.
# 158B params, MLA (compressed KV: 1 KV head x 512) + DeepSeek Sparse Attention (index_topk 512) +
# 256-expert MoE (6 active + 1 shared). 1M-token context ceiling.
#
# WHY g7e/Blackwell + Seoul (same as GLM-5.2): DSA attention kernels are gated to Hopper/Blackwell in
# mainline SGLang. NVIDIA ships an official NVFP4 build (nvidia/DeepSeek-V4-Flash-NVFP4) — MIXED
# precision: experts NVFP4 (4-bit), attention/shared-experts/head FP8. ~99 GB total → much lighter
# than GLM-5.2 (N~=2 vs 6), and MLA keeps KV tiny. The "Flash" tier: a cheaper frontier DSA headline.

name: deepseek-v4-flash-nvfp4
source:
  hf_repo: nvidia/DeepSeek-V4-Flash-NVFP4    # NVIDIA ModelOpt NVFP4 (experts) + FP8 (attention) mixed build
license: MIT

arch:
  num_layers: 43
  hidden_size: 4096
  num_attention_heads: 64
  num_key_value_heads: 1       # MLA — compressed latent KV (head_dim 512, q_lora_rank 1024). KV is tiny.
  head_dim: 512
  vocab_size: 129280
  num_local_experts: 256       # MoE; 6 active + 1 shared. Experts ride with their layer (inv #1).
  num_experts_per_tok: 6
  intermediate_size: 2048      # moe_intermediate_size (doc only — not parsed)
  index_topk: 512              # DeepSeek Sparse Attention indexer top-k (doc only — serving-engine concern)
  q_lora_rank: 1024            # MLA (doc only)
  max_context: 131072          # 128K conservative fit ceiling; model supports up to 1M. TODO confirm.
  sliding_window: null
  rope_theta: 10000
  tie_word_embeddings: false

quant:
  method: nvfp4                # mixed: experts NVFP4 (4-bit), attention/shared/head FP8

precision:
  kv_dtype: float8             # MLA latent KV — already tiny (1 KV head)
  embedding_dtype: bfloat16
  kv_model: full               # MLA compresses KV + DSA caps attention compute; conservative full here

footprint:
  total_weight_bytes: 106300000000   # ~99 GiB NVFP4-mixed (experts 4-bit + FP8 attention). MEASURE the real checkpoint on the box.

overheads:
  framework_overhead_bytes: 5368709120   # ~5 GiB CUDA + SGLang Blackwell. TODO measure on g7e.
  activation_buffer_bytes: 1073741824    # ~1 GiB. TODO measure.

fit_defaults:
  target_k: 8
  max_context: 8192

pool:
  instance_type: g7e.2xlarge
  region: ap-northeast-2        # SEOUL — same Blackwell home as the GLM-5.2 headline (DSA needs Blackwell)
  gpu: RTX PRO 6000 Blackwell
  gpu_vram_bytes: 103079215104  # 96 GiB
  gpu_count_per_node: 1
