# Cairn model-as-config — Llama-3.1-8B (COMPARABILITY model: KevlarFlow's exact).
#
# WHY: KevlarFlow (2026) evaluated Llama-3.1-8B as a 4-stage pipeline, injecting node kills →
# measuring MTTR. This reproduces that for the recovery comparison (Cairn's warm-spare reassign +
# replay-KV vs their background KV-replication, same model). Target: beat/match their 20x MTTR cut.
# NB: 8B bf16 fits one L4 weights-wise; the fit gives N=2 (K=8 KV headroom). For the KevlarFlow MTTR
# run, FORCE a >=4-way split at launch (a benchmark over-split) — the point is failure-injection on a
# pipeline, not the fit.
# License: Llama-3.1 community. Arch from the NousResearch/Meta-Llama-3.1-8B mirror (meta-llama is
# gated — needs an HF_TOKEN with the license accepted). Dense. See plan/prior-art.md.

name: llama-3.1-8b
source:
  hf_repo: meta-llama/Llama-3.1-8B   # gated — HF_TOKEN must have accepted the Llama-3.1 license
license: Llama-3.1-community

arch:
  num_layers: 32
  hidden_size: 4096
  num_attention_heads: 32
  num_key_value_heads: 8       # GQA
  head_dim: 128
  vocab_size: 128256
  num_local_experts: 0         # dense
  num_experts_per_tok: 0
  intermediate_size: 14336
  max_context: 131072
  sliding_window: null
  rope_theta: 500000
  tie_word_embeddings: false

quant:
  method: bf16

precision:
  kv_dtype: bfloat16
  embedding_dtype: bfloat16
  kv_model: full

footprint:
  total_weight_bytes: 16060522496   # ~15 GiB bf16 (8.03B params x 2). MEASURE on the box.

overheads:
  framework_overhead_bytes: 3221225472
  activation_buffer_bytes: 536870912

fit_defaults:
  target_k: 8
  max_context: 8192

pool:
  instance_type: g6.xlarge
  region: eu-south-2
  gpu: L4
  gpu_vram_bytes: 25769803776  # 24 GiB
  gpu_count_per_node: 1
